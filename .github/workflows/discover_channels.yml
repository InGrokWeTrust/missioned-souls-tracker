name: Discover Reactor Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client

      - name: Run discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          TRACKED_CHANNELS_FILE: tracked_channels.json
          CHANNEL_INACTIVITY_DAYS: "60"
        run: python discover_channels.py

      - name: Commit updated tracked_channels.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_channels.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update tracked channels [skip ci]"
          git push
