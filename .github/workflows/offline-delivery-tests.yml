name: Offline delivery tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autoreactions.py'
      - 'check_live_streams.py'
      - 'webhook_delivery.py'
      - 'tests/**'
      - '.github/workflows/offline-delivery-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: pip install -r requirements.txt
      - name: Test without production credentials
        run: python -m unittest discover -s tests -v
