name: Offline delivery tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autoreactions.py'
      - 'keyword_detector.py'
      - 'scripts/run_keyword_trial.py'
      - 'data/keyword_trial_cases.json'
      - 'data/reactor_history_next7_human_labels_20261022.csv'
      - 'check_live_streams.py'
      - 'webhook_delivery.py'
      - 'reaction_state.py'
      - 'discover_channels.py'
      - 'report_failure.py'
      - '.github/workflows/youtube-tracker.yml'
      - '.github/workflows/check_live_streams.yml'
      - 'tests/**'
      - '.github/workflows/offline-delivery-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: pip install -r requirements.txt
      - name: Test without production credentials
        run: python -m unittest discover -s tests -v
      - name: Replay curated reaction-quality shadow fixtures offline
        run: python -m scripts.run_keyword_trial
