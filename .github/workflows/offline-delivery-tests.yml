name: Offline delivery tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autoreactions.py'
      - 'check_live_streams.py'
      - 'webhook_delivery.py'
      - 'reaction_state.py'
      - 'vision_evaluator.py'
      - 'scripts/collect_vision_candidates.py'
      - 'scripts/run_vision_evaluation.py'
      - 'scripts/apply_human_labels.py'
      - 'scripts/create_review_page.py'
      - 'scripts/enrich_youtube_metadata.py'
      - 'scripts/augment_reactor_sample.py'
      - '.github/workflows/vision-youtube-manual-sample.yml'
      - 'data/vision-labels.csv'
      - '.github/workflows/vision-paid-manual-eval.yml'
      - 'discover_channels.py'
      - 'report_failure.py'
      - '.github/workflows/youtube-tracker.yml'
      - '.github/workflows/check_live_streams.yml'
      - 'tests/**'
      - '.github/workflows/offline-delivery-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: pip install -r requirements.txt
      - name: Test without production credentials
        run: python -m unittest discover -s tests -v
