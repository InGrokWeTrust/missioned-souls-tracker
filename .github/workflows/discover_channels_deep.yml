name: Discover Channels (Deep - Weekly)

on:
  schedule:
    # Runs every Sunday at 03:17 UTC (quiet time)
    - cron: '17 3 * * 0'
  workflow_dispatch:          # Allow manual trigger

jobs:
  deep-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # needed so we can push later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client

      - name: Run Deep Channel Discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          TRACKED_CHANNELS_FILE: tracked_channels.json
          DISCOVERY_MODE: deep                # ← forces 20 pages
          DAYS_LOOKBACK: 21
          CHANNEL_INACTIVITY_DAYS: ${{ vars.CHANNEL_INACTIVITY_DAYS || 60 }}
        run: python discover_channels.py

      - name: Commit & push updated tracked_channels.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tracked_channels.json
          
          if git diff --staged --quiet; then
            echo "No changes to tracked_channels.json"
          else
            git commit -m "chore: deep discovery update $(date -u +%Y-%m-%d)"
            git push
          fi
