name: YouTube Reaction Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log run time
        run: echo "Run at $(date) - triggered by ${{ github.event_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client requests

      - name: Download previous last_run.json
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: youtube-tracker.yml
          name: last-run-state
          path: ./
          if_no_artifact_found: warn

      - name: Run YouTube reaction tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          MAX_TO_SEND: ${{ vars.MAX_TO_SEND }}
          MAX_VIDEOS_PER_CHANNEL: ${{ vars.MAX_VIDEOS_PER_CHANNEL }}
          FORCE_SEND_ALL: ${{ vars.FORCE_SEND_ALL }}
          LAST_RUN_FILE: ${{ vars.LAST_RUN_FILE }}
          TRACKED_CHANNELS_FILE: tracked_channels.json
        run: python autoreactions.py

      - name: Upload last_run.json for next run
        uses: actions/upload-artifact@v4
        with:
          name: last-run-state
          path: last_run.json
          retention-days: 1
