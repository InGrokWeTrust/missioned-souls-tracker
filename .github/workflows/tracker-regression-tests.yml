name: Tracker regression tests

on:
  pull_request:
    paths:
      - '*.py'
      - 'historical_deliveries.json'
      - '.github/workflows/tracker-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest requests google-api-python-client
      - name: Run complete discovered Python regression suite without production secrets
        run: python -m pytest -q
