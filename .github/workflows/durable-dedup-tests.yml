name: Tracker safety regression tests

on:
  pull_request:
    paths:
      - 'autoreactions.py'
      - 'check_live_streams.py'
      - 'notification_history.py'
      - 'channel_exclusions.py'
      - 'discover_channels.py'
      - 'tracked_channels.json'
      - 'tests/test_hcjb_exclusion.py'
      - 'tests/test_shorts_filter.py'
      - 'discovery_video_handoff.py'
      - 'thumbnail_policy.py'
      - 'video_release_policy.py'
      - 'tests/test_discovery_release_thumbnails.py'
      - 'tests/test_pending_reaction_queue.py'
      - 'tests/test_preserve_inactive_channels.py'
      - 'tests/test_two_page_discovery.py'
      - 'tests/test_durable_dedup.py'
      - '.github/workflows/youtube-tracker.yml'
      - '.github/workflows/check_live_streams.yml'
      - '.github/workflows/durable-dedup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: pip install -r requirements.txt
      - name: Verify dedup and HCJB exclusion without production credentials or webhooks
        env:
          YOUTUBE_API_KEY: offline-test-key
          DISCORD_WEBHOOK_URL: https://example.invalid/no-webhook
          HISTORY_ENABLED: "true"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
