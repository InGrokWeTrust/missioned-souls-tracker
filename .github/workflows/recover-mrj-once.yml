name: Recover Mr J missed reactions once

on:
  push:
    branches: [main]
    paths:
      - 'recover_mrj_once.py'
      - '.github/workflows/recover-mrj-once.yml'

permissions:
  contents: write

concurrency:
  group: missioned-souls-notifications-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Verify bounded, exact-video recovery and deliver once
        env:
          MRJ_ONE_TIME_RECOVERY: approved
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python recover_mrj_once.py
