name: Check Live Streams

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview eligible alerts only; never send to Discord or modify state"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

# Serialize both notification workflows to avoid cross-run duplicate posts.
concurrency:
  group: missioned-souls-notifications-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log run time
        run: echo "Run at $(date) - triggered by ${{ github.event_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client requests

      - name: Download previous live_last_run.json
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: check_live_streams.yml
          name: live-last-run-state
          path: ./
          branch: ${{ github.ref_name }}
          workflow_conclusion: ''
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn

      - name: Run live stream checker
        env:
          DRY_RUN: ${{ (inputs.dry_run && 'true') || vars.DRY_RUN || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_ENABLED: "true"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          MAX_TO_SEND: ${{ vars.MAX_TO_SEND }}
          FORCE_SEND_ALL: ${{ vars.FORCE_SEND_ALL }}
          LIVE_LAST_RUN_FILE: live_last_run.json
        shell: bash
        run: |
          set -o pipefail
          python check_live_streams.py 2>&1 | tee live-checker-output.log

      - name: Upload live_last_run.json for next run
        if: ${{ always() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-last-run-state
          path: live_last_run.json
          retention-days: 7
          if-no-files-found: error

      - name: Report diagnosed production failure to dedicated health webhook
        if: ${{ failure() && github.ref == 'refs/heads/main' && env.DRY_RUN != 'true' }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALERT_LOG_FILE: live-checker-output.log
        run: python report_failure.py
