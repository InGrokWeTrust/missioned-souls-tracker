name: Check Live Streams

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log run time
        run: echo "Run at $(date) - triggered by ${{ github.event_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client requests

      - name: Download previous live_last_run.json
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: check_live_streams.yml
          name: live-last-run-state
          path: ./
          if_no_artifact_found: warn

      - name: Run live stream checker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          MAX_TO_SEND: ${{ vars.MAX_TO_SEND }}
          FORCE_SEND_ALL: ${{ vars.FORCE_SEND_ALL }}
          LIVE_LAST_RUN_FILE: live_last_run.json
        run: python check_live_streams.py

      - name: Upload live_last_run.json for next run
        uses: actions/upload-artifact@v4
        with:
          name: live-last-run-state
          path: live_last_run.json
          retention-days: 1
