name: One-time resolve and add linked reaction channel

on:
  push:
    paths:
      - '.github/workflows/one-time-add-linked-reaction-channel.yml'

permissions:
  contents: write

concurrency:
  group: one-time-add-reaction-channel
  cancel-in-progress: false

jobs:
  add-linked-channel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube metadata client
        run: pip install google-api-python-client
      - name: Resolve exact video's uploader and add only that channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from googleapiclient.discovery import build

          VIDEO_ID = 'PM62MOyitbI'
          EXCLUDED = {'UCtEs-cB4K1XFnXgLrIWW1Zg'}  # HCJB
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api_key = os.environ['YOUTUBE_API_KEY']

          youtube = build('youtube', 'v3', developerKey=api_key)
          response = youtube.videos().list(part='snippet,status', id=VIDEO_ID).execute()
          items = response.get('items', [])
          if len(items) != 1 or items[0].get('id') != VIDEO_ID:
              raise RuntimeError('Requested YouTube video is inaccessible; no changes made')
          snippet = items[0].get('snippet', {})
          channel_id = snippet.get('channelId', '')
          channel_title = snippet.get('channelTitle', '')
          video_title = snippet.get('title', '')
          if not re.fullmatch(r'UC[A-Za-z0-9_-]{22}', channel_id):
              raise RuntimeError('YouTube did not return a valid uploader channel ID')
          if not isinstance(channel_title, str) or not channel_title.strip():
              raise RuntimeError('YouTube did not return an uploader channel name')
          if channel_id in EXCLUDED:
              raise RuntimeError('Requested video is from an excluded channel')
          print('Verified video:', VIDEO_ID)
          print('Verified title:', video_title)
          print('Verified uploader:', channel_title)
          print('Verified channel ID:', channel_id)

          url = f'https://api.github.com/repos/{repo}/contents/tracked_channels.json'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'missioned-souls-manual-reactor-add',
          }
          for attempt in range(5):
              req = urllib.request.Request(url + '?ref=main', headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  remote = json.load(response)
              payload = json.loads(base64.b64decode(remote['content']).decode('utf-8'))
              channels = payload['channels']
              if channel_id in channels:
                  print('ALREADY_TRACKED:', channel_id, channels[channel_id].get('title'))
                  break
              now = datetime.now(timezone.utc).isoformat()
              channels[channel_id] = {
                  'title': channel_title,
                  'added_at': now,
                  'last_seen_at': now,
                  'manually_added_from_video_id': VIDEO_ID,
              }
              # No edits to delivered IDs, pending queues or last_discovery_run.
              data = json.dumps(payload, ensure_ascii=False, indent=2) + '\n'
              update = {
                  'message': f'Add verified reactor channel from linked video {VIDEO_ID} [skip ci]',
                  'branch': 'main',
                  'sha': remote['sha'],
                  'content': base64.b64encode(data.encode('utf-8')).decode('ascii'),
              }
              upd_headers = dict(headers, **{'Content-Type':'application/json'})
              put = urllib.request.Request(url, data=json.dumps(update).encode('utf-8'),
                                           headers=upd_headers, method='PUT')
              try:
                  with urllib.request.urlopen(put, timeout=25) as saved:
                      result = json.load(saved)
                  print('CHANNEL_ADDED:', channel_id, channel_title)
                  print('NEW_TRACKED_COUNT:', len(channels))
                  print('REGISTRY_COMMIT:', result['commit']['sha'])
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422) or attempt == 4:
                      raise
                  print('Concurrent registry update; reloading and retrying', attempt + 1)
          else:
              raise RuntimeError('Unable to save channel registration safely')
          PY
